name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract complete project
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP" ]; then
            mkdir -p /tmp/alataya
            unzip -q "$ZIP" -d /tmp/alataya
            ROOT=$(find /tmp/alataya -mindepth 1 -maxdepth 1 -type d | head -n 1)
            cp -a "$ROOT"/. .
            rm -rf /tmp/alataya
          fi

          test -f package.json
          test -f src/main.tsx

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Setup Capacitor Android
        run: |
          rm -rf android
          npx cap add android

          mkdir -p android/app/src/main/java/com/abdullahataya/fooddistribution

          cp native/android/com/abdullahataya/fooddistribution/*.java \
            android/app/src/main/java/com/abdullahataya/fooddistribution/

          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlAtaya-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
