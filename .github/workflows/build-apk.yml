name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect project directory
        run: |
          if [ -f "package.json" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "alataya/package.json" ]; then
            echo "PROJECT_DIR=alataya" >> "$GITHUB_ENV"
          else
            echo "package.json not found"
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build web app
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools"

      - name: Create Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          rm -rf android
          npx cap add android

          mkdir -p android/app/src/main/java/com/abdullahataya/fooddistribution

          cp native/android/com/abdullahataya/fooddistribution/*.java \
            android/app/src/main/java/com/abdullahataya/fooddistribution/

          npx cap sync android

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlAtaya-Android-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
