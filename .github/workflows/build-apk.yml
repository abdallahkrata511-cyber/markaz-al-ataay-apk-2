name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools"

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android

          mkdir -p android/app/src/main/java/com/abdullahataya/fooddistribution

          cp native/android/com/abdullahataya/fooddistribution/*.java \
            android/app/src/main/java/com/abdullahataya/fooddistribution/

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          s = manifest.read_text()

          perms = """    <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
          """

          if "android.permission.BLUETOOTH_CONNECT" not in s:
              s = s.replace("<application", perms + "\n    <application", 1)

          s = s.replace(
              'android:name=".MainActivity"',
              'android:name="com.abdullahataya.fooddistribution.MainActivity"'
          )

          manifest.write_text(s)
          PY

          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlAtaya-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
